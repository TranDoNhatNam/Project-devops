server {
        listen 80;
        listen [::]:80;
        server_name html.bihouse.win;
        return 301  https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name html.bihouse.win;

        ssl_certificate /etc/nginx/ssl/bihouse.win.crt;
        ssl_certificate_key /etc/nginx/ssl/bihouse.win.key;

        root /;
        index index.html;

        location / {
                try_files $uri $uri/ =404;
        }


}
