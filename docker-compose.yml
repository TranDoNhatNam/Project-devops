
services:
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - public_assets:/var/www/public
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: travela
      DB_USERNAME: travela_user
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - travela


  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - public_assets:/var/www/public:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - travela

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travela
      MYSQL_USER: travela_user
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "LocalRoot_2026_Strong"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - travela

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - travela

networks:
  travela:

volumes:
  mysql_data:
  redis_data:
  public_assets:
